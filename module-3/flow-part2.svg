<text x="810.0" y="378.0" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="22" font-weight="normal" fill="#000000" text-anchor="middle">SYSTEM_PROMPT</text>
<text x="810.0" y="420.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#374151" text-anchor="middle">answer only from</text>
