<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">Part 2: the same flow, built by hand</title>
<desc id="d">A question is retrieved against with SearchClient.search using hybrid and semantic search, grounded with a system prompt that says to answer only from the passages, and answered by a chat completion. The three steps live in the answer_question function. The Search index and the gpt-5-mini deployment are shown dashed as context.</desc>
