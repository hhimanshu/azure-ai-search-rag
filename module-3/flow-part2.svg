<text x="40" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#000000" text-anchor="start">Part 2: the same flow, built by hand</text>
<rect x="40" y="300" width="200" height="200" rx="14" fill="#F3F4F6" stroke="#000000" stroke-width="2.5"/>
<text x="140.0" y="378.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#000000" text-anchor="middle">Question</text>
<text x="140.0" y="414.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#374151" text-anchor="middle">one driver&#x27;s</text>
<text x="140.0" y="444.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#374151" text-anchor="middle">question</text>
