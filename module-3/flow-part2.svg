<text x="450.0" y="408.0" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="22" font-weight="normal" fill="#000000" text-anchor="middle">SearchClient.search</text>
<text x="450.0" y="450.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#374151" text-anchor="middle">hybrid + semantic</text>
