<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">Indexing pipeline: four parts, built over three clips</title>
<desc id="d">Blob Storage feeds a data source, a skillset, an indexer, and an index. Clip 1 builds all four parts: OCR, merge, and split skills, and an index with chunk fields. Clip 2 adds an embedding skill, a vector field, and a vectorizer. Clip 3 adds a state field with a filter, and a semantic ranker. Queries then search the index.</desc>
